<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="https://telegram.org"></script>
<title>Candy Match Arena • Play & Earn</title>
<style>
  :root {
    --bg-app: #0b0e17;
    --card-bg: #151b2b;
    --card-border: rgba(255, 255, 255, 0.08);
    --board-bg: #1c2438;
    --cell-bg: #111625;
    --accent-pink: #ff2e93;
    --accent-cyan: #00f5d4;
    --accent-gold: #ffbe0b;
    --text-main: #ffffff;
    --text-sub: #94a3b8;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at top, #19223c 0%, var(--bg-app) 80%);
    color: var(--text-main);
    padding: 12px 12px 30px;
    min-height: 100vh;
  }

  /* Card Container */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
  }

  /* Top Profile Section (Matching Screenshot) */
  .profile-top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }

  .avatar-ring {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
    box-shadow: 0 0 16px rgba(0, 245, 212, 0.35);
    flex-shrink: 0;
  }

  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 900;
    color: var(--accent-cyan);
    overflow: hidden;
  }

  .user-meta h2 {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.2px;
  }

  .coin-display {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 16px;
    font-weight: 800;
    color: var(--accent-gold);
  }

  .level-pill {
    margin-left: auto;
    background: rgba(0, 245, 212, 0.12);
    border: 1px solid rgba(0, 245, 212, 0.4);
    color: var(--accent-cyan);
    padding: 5px 11px;
    border-radius: 14px;
    font-size: 12px;
    font-weight: 800;
  }

  /* 3 Action Pills (Play, Referral, Withdraw) */
  .action-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .pill-btn {
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: #1d253a;
    color: #fff;
    padding: 10px 6px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: transform 0.12s, box-shadow 0.15s;
  }

  .pill-btn:active {
    transform: scale(0.95);
  }

  .pill-btn.primary {
    background: linear-gradient(135deg, #ff2e93, #d90467);
    border: none;
    box-shadow: 0 4px 15px rgba(255, 46, 147, 0.4);
  }

  /* Board Header & Level Challenge */
  .board-header {
    text-align: center;
    margin-bottom: 10px;
  }

  .board-header h3 {
    margin: 0 0 4px;
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 0.3px;
  }

  .challenge-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0e1320;
    border: 1px solid rgba(0, 245, 212, 0.25);
    border-radius: 14px;
    padding: 8px 12px;
    margin: 8px 0 6px;
    font-size: 12.5px;
  }

  .challenge-goal {
    font-weight: 700;
    color: var(--accent-cyan);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .moves-badge {
    background: rgba(255, 46, 147, 0.18);
    border: 1px solid var(--accent-pink);
    color: #ff70b5;
    padding: 3px 9px;
    border-radius: 10px;
    font-weight: 900;
    font-size: 12px;
  }

  .progress-wrap {
    height: 7px;
    background: #0d111c;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
    transition: width 0.3s ease;
  }

  #statusMsg {
    text-align: center;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent-gold);
    min-height: 18px;
    margin-bottom: 6px;
  }

  /* 8x8 Match-3 Grid */
  #board {
    width: 100%;
    max-width: 344px;
    margin: 0 auto;
    background: var(--board-bg);
    border: 2px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    padding: 6px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
    box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.5);
  }

  .cell {
    aspect-ratio: 1;
    background: var(--cell-bg);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.12s, background 0.15s;
    box-shadow: inset 0 -2px 0 rgba(255, 255, 255, 0.04);
    padding: 4px;
  }

  .cell svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.45));
    transition: transform 0.15s;
  }

  .cell:active {
    transform: scale(0.9);
  }

  .cell.sel {
    background: rgba(0, 245, 212, 0.22);
    outline: 2px solid var(--accent-cyan);
    transform: scale(0.92);
    box-shadow: 0 0 12px rgba(0, 245, 212, 0.5);
  }

  /* Daily Bonus Footer Bar */
  .bonus-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(90deg, #161d31, #1e2640);
    border: 1px solid rgba(255, 190, 11, 0.3);
    border-radius: 16px;
    padding: 11px 14px;
    margin-bottom: 12px;
    font-size: 13px;
  }

  .bonus-btn {
    background: var(--accent-gold);
    color: #0b0e17;
    border: none;
    padding: 6px 12px;
    border-radius: 10px;
    font-weight: 900;
    font-size: 12px;
    cursor: pointer;
  }

  .bonus-btn:disabled {
    background: #2a344d;
    color: var(--text-sub);
    cursor: default;
  }

  /* Leaderboard */
  .leader-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-weight: 800;
    font-size: 15px;
    color: var(--accent-cyan);
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    font-size: 13.5px;
  }

  .row:last-child { border-bottom: none; }

  .p-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .rank-tag {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: #232d45;
    font-size: 11px;
    font-weight: 900;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .r-1 { background: #ffbe0b; color: #000; }
  .r-2 { background: #cbd5e1; color: #000; }
  .r-3 { background: #d97706; color: #fff; }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot.on { background: #00f5d4; box-shadow: 0 0 8px #00f5d4; }
  .dot.off { background: #64748b; }

  /* Modals */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 15, 0.85);
    backdrop-filter: blur(5px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal-backdrop.show { display: flex; }

  .modal-box {
    background: #151b2b;
    border: 1px solid var(--accent-cyan);
    border-radius: 22px;
    padding: 20px;
    width: 100%;
    max-width: 370px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
  }

  .modal-box h3 {
    margin: 0 0 8px;
    color: var(--accent-cyan);
    font-size: 19px;
  }

  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 5px;
    font-weight: 700;
  }

  .input-box {
    width: 100%;
    padding: 11px 12px;
    border-radius: 12px;
    background: #0b0e17;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  .input-box:focus { border-color: var(--accent-cyan); }

  .modal-btns {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
</style>
</head>
<body>

  <!-- Top Profile Card -->
  <div class="card">
    <div class="profile-top">
      <div class="avatar-ring">
        <div class="avatar-inner" id="avatar">J</div>
      </div>
      <div class="user-meta">
        <h2 id="pname">Player</h2>
        <div class="coin-display">🪙 <span id="coins">1,250</span> coins</div>
      </div>
      <div class="level-pill" id="levelBadge">LVL 1</div>
    </div>

    <div class="action-row">
      <button class="pill-btn primary" onclick="startLevel(currentLevel)">▶ Play</button>
      <button class="pill-btn" onclick="inviteFriend()">🔗 Referral</button>
      <button class="pill-btn" onclick="openWithdraw()">📥 Withdraw</button>
    </div>
  </div>

  <!-- Match-3 Board Card -->
  <div class="card">
    <div class="board-header">
      <h3>Match-3 Board</h3>
      <div class="challenge-bar">
        <div class="challenge-goal" id="challengeText">🎯 Goal: 300 pts</div>
        <div class="moves-badge">Moves: <span id="movesLeft">15</span></div>
      </div>
      <div class="progress-wrap"><div class="progress-fill" id="progBar"></div></div>
      <div id="statusMsg">Swap 3+ matching candies to score!</div>
    </div>

    <div id="board"></div>
  </div>

  <!-- Daily Bonus Bar -->
  <div class="bonus-bar">
    <div>🎁 <span id="bonusText">Daily Bonus Ready!</span></div>
    <button class="bonus-btn" id="bonusBtn" onclick="claimDailyBonus()">Claim +100 🪙</button>
  </div>

  <!-- Unique Leaderboard -->
  <div class="card">
    <div class="leader-head">
      <span>🏆 Top Arena Players</span>
