<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="https://telegram.org"></script>
<title>Candy Match Saga • Play & Earn</title>
<style>
  :root {
    --bg-top: #3b0d54;
    --bg-mid: #220736;
    --bg-bot: #12031f;
    --panel-bg: linear-gradient(180deg, rgba(68, 22, 99, 0.92) 0%, rgba(39, 11, 61, 0.96) 100%);
    --panel-border: rgba(255, 182, 230, 0.28);
    --board-frame: linear-gradient(180deg, #ff70b8 0%, #c9186b 100%);
    --board-inner: #2b0b3f;
    --cell-bg: rgba(255, 255, 255, 0.08);
    --gold-light: #ffe66d;
    --gold-dark: #f59e0b;
    --pink-light: #ff6bb5;
    --pink-dark: #d90467;
    --cyan-light: #38bdf8;
    --cyan-dark: #0284c7;
    --green-light: #4ade80;
    --green-dark: #16a34a;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
    color: #fff;
    padding: 10px 12px 32px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 3D Glossy Panel */
  .candy-card {
    background: var(--panel-bg);
    border: 1.5px solid var(--panel-border);
    border-radius: 24px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow:
      0 12px 28px rgba(0, 0, 0, 0.55),
      inset 0 2px 1px rgba(255, 255, 255, 0.22);
  }

  /* Top Profile Header */
  .profile-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .avatar-wrap {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(180deg, #ffe66d 0%, #ff5e8a 100%);
    box-shadow: 0 4px 14px rgba(255, 94, 138, 0.55);
    flex-shrink: 0;
  }

  .avatar-core {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #7c2ae8, #3b0d54);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 900;
    color: #ffe66d;
    overflow: hidden;
  }

  .avatar-core img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .user-details {
    flex: 1;
    min-width: 0;
  }

  .user-name {
    font-size: 19px;
    font-weight: 900;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .coin-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 4px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 230, 109, 0.4);
    padding: 3px 10px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 900;
    color: var(--gold-light);
  }

  .lvl-badge {
    background: linear-gradient(180deg, #ffe66d 0%, #f59e0b 100%);
    color: #3b0d00;
    font-weight: 900;
    font-size: 12px;
    padding: 6px 11px;
    border-radius: 14px;
    box-shadow: 0 4px 0 #b45309, 0 6px 12px rgba(0, 0, 0, 0.4);
    text-transform: uppercase;
  }

  /* Juicy 3D Jelly Buttons */
  .jelly-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .jelly-btn {
    position: relative;
    border: none;
    border-radius: 18px;
    padding: 10px 6px;
    font-weight: 900;
    font-size: 13px;
    color: #fff;
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    transition: transform 0.08s, box-shadow 0.08s;
  }

  .jelly-btn::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 10%;
    right: 10%;
    height: 38%;
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0));
    pointer-events: none;
  }

  .jelly-btn:active {
    transform: translateY(3px);
  }

  .btn-pink {
    background: linear-gradient(180deg, var(--pink-light) 0%, var(--pink-dark) 100%);
    box-shadow: 0 4px 0 #8f0042, 0 6px 14px rgba(217, 4, 103, 0.45);
  }
  .btn-pink:active { box-shadow: 0 1px 0 #8f0042; }

  .btn-blue {
    background: linear-gradient(180deg, var(--cyan-light) 0%, var(--cyan-dark) 100%);
    box-shadow: 0 4px 0 #075985, 0 6px 14px rgba(2, 132, 199, 0.4);
  }
  .btn-blue:active { box-shadow: 0 1px 0 #075985; }

  .btn-green {
    background: linear-gradient(180deg, var(--green-light) 0%, var(--green-dark) 100%);
    box-shadow: 0 4px 0 #14532d, 0 6px 14px rgba(22, 163, 74, 0.4);
  }
  .btn-green:active { box-shadow: 0 1px 0 #14532d; }

  /* Challenge & Board Header */
  .saga-title {
    text-align: center;
    font-size: 20px;
    font-weight: 900;
    margin: 0 0 8px;
    background: linear-gradient(180deg, #ffffff 20%, #ffd1ec 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
  }

  .quest-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(18, 3, 31, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    padding: 8px 12px;
    margin-bottom: 8px;
  }

  .quest-goal {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 800;
    color: #ffe66d;
  }

  .moves-counter {
    background: linear-gradient(180deg, #ff5e8a, #c9184a);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12.5px;
    font-weight: 900;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
  }

  .sugar-bar {
    height: 10px;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 20px;
    padding: 2px;
    margin-bottom: 8px;
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  .sugar-fill {
    height: 100%;
    width: 0%;
    border-radius: 20px;
    background: linear-gradient(90deg, #ffbe0b, #ff2e93, #38bdf8);
    box-shadow: 0 0 10px rgba(255, 46, 147, 0.7);
    transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #bannerMsg {
    text-align: center;
    font-size: 13px;
    font-weight: 800;
    color: #ffd6f0;
    min-height: 19px;
    margin-bottom: 8px;
  }

  /* 3D Recessed Candy Board */
  .board-bezel {
    width: 344px;
    max-width: 93vw;
    margin: 0 auto;
    padding: 6px;
    border-radius: 22px;
    background: var(--board-frame);
    box-shadow:
      0 8px 0 #7a093e,
      0 16px 32px rgba(0, 0, 0, 0.65),
      inset 0 2px 2px rgba(255, 255, 255, 0.5);
  }

  #board {
    background: var(--board-inner);
    border-radius: 17px;
    padding: 6px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
    box-shadow: inset 0 5px 14px rgba(0, 0, 0, 0.75);
  }

  .cell {
    aspect-ratio: 1;
    background: var(--cell-bg);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3px;
    cursor: pointer;
    position: relative;
    transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.12), inset 0 -2px 3px rgba(0, 0, 0, 0.35);
  }

  .cell svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.55));
    transition: transform 0.15s ease;
  }

  .cell.sel {
    background: rgba(255, 230, 109, 0.28);
    outline: 2.5px solid #ffe66d;
    transform: scale(1.08);
    z-index: 2;
    box-shadow: 0 0 15px rgba(255, 230, 109, 0.75);
  }

  .cell.pop svg {
    animation: candyPop 0.28s ease-out forwards;
  }

  @keyframes candyPop {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.35); opacity: 0.9; }
    100% { transform: scale(0); opacity: 0; }
  }

  .board-footer {
    display: flex;
    justify-content: space-between;
    padding: 10px 4px 0;
    font-size: 13px;
    font-weight: 800;
    color: #e9d5ff;
  }

  /* Daily Bonus Strip */
  .daily-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(90deg, rgba(88, 28, 135, 0.85), rgba(131, 24, 67, 0.85));
    border: 1.5px solid rgba(255, 230, 109, 0.35);
    border-radius: 18px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 13px;
    font-weight: 800;
  }

  .claim-btn {
    background: linear-gradient(180deg, #ffe66d 0%, #f59e0b 100%);
    color: #3b0d00;
    border: none;
    padding: 7px 13px;
    border-radius: 12px;
    font-weight: 900;
    font-size: 12px;
    cursor: pointer;
    box-shadow: 0 3px 0 #b45309;
  }

  .claim-btn:disabled {
    background: rgba(255, 255, 255, 0.12);
    color: rgba(255, 255, 255, 0.5);
    box-shadow: none;
    cursor: default;
  }

  /* Leaderboard */
  .lb-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
    font-weight: 900;
    color: #ffe66d;
    margin-bottom: 8px;
  }

  .lb-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 13.5px;
  }
  .lb-row:last-child { border-bottom: none; }

  .lb-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .status-dot.on { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  .status-dot.off { background: #94a3b8; }

  /* Modal */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 3, 26, 0.85);
    backdrop-filter: blur(6px);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-bg.open { display: flex; }

  .modal-box {
    background: linear-gradient(180deg, #4a156e 0%, #26093b 100%);
    border: 2px solid #ff70b8;
    border-radius: 24px;
    padding: 20px;
    width: 100%;
    max-width: 365px;
