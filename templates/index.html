<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Candy Match</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui;background:#FFF8F0;color:#333;padding-bottom:20px}
.top{background:#fff;margin:12px 14px;padding:14px;border-radius:18px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.avatar{width:56px;height:56px;border-radius:50%;background:#FFE8EE;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:30px;border:2px solid #FFD6E0}
.avatar img{width:100%;height:100%;object-fit:cover}
.p-name{font-weight:800;font-size:20px;color:#222}
.p-coins{font-weight:700;font-size:17px;margin-top:2px}
.btns-top{display:flex;gap:8px;margin:0 14px}
.b{flex:1;border:0;padding:11px 6px;border-radius:20px;font-weight:700;font-size:13px;cursor:pointer}
.b-play{background:#FF4D8D;color:#fff}
.b-ref{background:#fff;border:1.5px solid #eee;color:#333}
.b-with{background:#fff;border:1.5px solid #eee;color:#333}
.card{background:#FFF6E8;margin:14px;border-radius:18px;padding:14px;box-shadow:0 4px 14px rgba(0,0,0,.05);text-align:center}
.card h2{margin:0;font-size:20px}
.card p{margin:4px 0 10px;font-size:13px;color:#777}
#msg{text-align:center;font-weight:700;color:#FF4D8D;min-height:20px;font-size:14px}
#board{width:340px;max-width:92vw;margin:8px auto;background:#FFF3D6;border-radius:14px;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.cell{aspect-ratio:1;background:#FFFDF5;border:1px solid #FFECC0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;user-select:none}
.cell.sel{outline:3px solid #FF4D8D;background:#FFE0EC;transform:scale(.92)}
.info{display:flex;justify-content:space-between;padding:8px 4px 0;font-size:13px;font-weight:700;color:#666}
.bottom{margin:14px;background:#fff;border-radius:14px;padding:12px}
.bottom b{display:block;text-align:center;margin-bottom:6px}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee;font-size:14px}
.daily{text-align:center;font-size:12px;color:#888;margin-top:14px}
</style>
</head>
<body>
<div class="top">
  <div class="avatar" id="avatar">👦</div>
  <div><div class="p-name" id="pname">John</div><div class="p-coins">🪙 <span id="coins">1,250</span> coins</div></div>
</div>
<div class="btns-top">
  <button class="b b-play" onclick="newGame()">▶ Play</button>
  <button class="b b-ref" onclick="invite()">🔗 Referral</button>
  <button class="b b-with" onclick="withdraw()">💳 Withdraw</button>
</div>

<div class="card">
  <h2>Match-3 Board</h2>
  <p>Swap 3+ matching candies to score! Moves: <span id="moves">12</span></p>
  <div id="msg">Complete the game to get paid!</div>
  <div id="board"></div>
  <div class="info"><span>Score: <span id="score">0</span></span><span>Reward on Finish: <span id="reward">0</span> 🪙</span></div>
</div>

<div class="bottom"><b>🏆 Leaderboard</b><div id="list">Loading...</div></div>
<div class="daily" id="daily">🎁 Daily Bonus available in 03:24:11</div>

<script>
let tg=window.Telegram?.WebApp; if(tg){tg.expand();}
let userId=tg?.initDataUnsafe?.user?.id?.toString()||localStorage.getItem('uid')||"guest_"+Math.floor(Math.random()*99999);
localStorage.setItem('uid',userId);
let username=tg?.initDataUnsafe?.user?.first_name||localStorage.getItem('uname')||"John";
localStorage.setItem('uname',username);
let photo=tg?.initDataUnsafe?.user?.photo_url;
if(photo){document.getElementById('avatar').innerHTML=`<img src="${photo}">`;}
document.getElementById('pname').innerText=username;
let coins=parseInt(localStorage.getItem('coins')||1250);
let score=0, moves=12, selected=null, gameOver=false;
const candies=['❤️','🍇','🟩','💧','⭐'];
let board=[];const el=document.getElementById('board');
function updateUI(){
  document.getElementById('coins').innerText=coins.toLocaleString();
  document.getElementById('score').innerText=score;
  document.getElementById('moves').innerText=moves;
  document.getElementById('reward').innerText=Math.floor(score/10);
  localStorage.setItem('coins',coins);
}
function build(){board=[];el.innerHTML='';score=0;moves=12;gameOver=false;selected=null;
  for(let i=0;i<64;i++){let c=candies[Math.floor(Math.random()*candies.length)];board.push(c);let d=document.createElement('div');d.className='cell';d.innerText=c;d.onclick=()=>clickCell(i);el.appendChild(d);}
  updateUI();document.getElementById('msg').innerText='Complete the game to get paid!';}
function render(){[...el.children].forEach((d,i)=>{d.innerText=board[i];d.classList.toggle('sel',i===selected);});}
function clickCell(i){
  if(gameOver) return;
  if(selected===null){selected=i;render();return;}
  let a=selected;selected=null;
  let r1=Math.floor(a/8),c1=a%8,r2=Math.floor(i/8),c2=i%8;
  if(Math.abs(r1-r2)+Math.abs(c1-c2)!==1){render();return;}
  [board[a],board[i]]=[board[i],board[a]];render();moves--;updateUI();setTimeout(checkMatches,200);
  if(moves<=0){setTimeout(finishGame,400);}
}
function checkMatches(){
  let matched=new Set();
  for(let r=0;r<8;r++)for(let c=0;c<6;c++){let idx=r*8+c;if(board[idx]===board[idx+1]&&board[idx]===board[idx+2]){matched.add(idx);matched.add(idx+1);matched.add(idx+2);}}
  for(let c=0;c<8;c++)for(let r=0;r<6;r++){let idx=r*8+c;if(board[idx]===board[idx+8]&&board[idx]===board[idx+16]){matched.add(idx);matched.add(idx+8);matched.add(idx+16);}}
  if(matched.size===0) return;
  score+=matched.size*10;
  matched.forEach(i=>board[i]=candies[Math.floor(Math.random()*candies.length)]);
  updateUI();render();
}
function finishGame(){
  gameOver=true;
  let reward=Math.floor(score/10);
  if(reward<20) reward=20; // minimum pay per completed game
  coins+=reward;
  document.getElementById('msg').innerText=`🎉 Game Complete! You earned +${reward} coins!`;
  updateUI();
  saveToServer(reward);
  alert(`🎉 Game Complete!\n\nScore: ${score}\nYou earned: +${reward} coins\nNew Balance: ${coins} coins\n\nTap Play to play again!`);
}
function saveToServer(reward){
  // SAVE PLAYER LOG - this is what fixes leaderboard
  fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,username:username,coins:coins,score:score,level:1,last_reward:reward})})
  .then(()=>loadLeaderboard()).catch(()=>loadLeaderboard());
}
function invite(){let link=`https://t.me/candymatchs_bot?start=${userId}`;if(tg)tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent('Play Candy Match with me!')}`);else alert('Your link: '+link);}
function withdraw(){
  if(coins<1000){alert('You need 1,000 coins to withdraw.\nYou have: '+coins);return;}
  let w=prompt('Enter wallet / account:\nYou have '+coins+' coins');if(!w)return;
  alert('✅ Withdraw request sent!\nAdmin will pay you within 24h.');
  fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,username:username,coins:coins,score:score,withdraw_request:w})});
}
async function loadLeaderboard(){
  try{
    let r=await fetch('/api/user',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,username:username,referred_by:tg?.initDataUnsafe?.start_param||null})});
    let d=await r.json(); if(d.coins!==undefined && localStorage.getItem('coins')==='1250') coins=d.coins; updateUI();
    let l=await (await fetch('/api/leaderboard')).json();
    document.getElementById('list').innerHTML=l.map((x,i)=>`<div class="row"><span>${i+1}. ${x.name||x.username}</span><span>${x.score} pts • ${x.coins} 🪙</span></div>`).join('')||'No players yet - be first!';
  }catch(e){document.getElementById('list').innerText='Play to appear here!';}
}
function newGame(){build();}
build();updateUI();loadLeaderboard();
</script>
</body>
</html>
