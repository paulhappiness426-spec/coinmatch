<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Candy Match</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui;background:linear-gradient(180deg,#ff5e8a,#7b2ff7);color:#fff;text-align:center;min-height:100vh}
.top{display:flex;justify-content:space-between;padding:12px 14px;background:rgba(0,0,0,.25);font-weight:700}
.top span{background:#fff;color:#333;padding:6px 12px;border-radius:20px;font-size:14px}
h1{margin:8px 0 2px;font-size:28px;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.sub{opacity:.9;font-size:13px;margin-bottom:10px}
#board{width:320px;height:320px;margin:10px auto;background:rgba(255,255,255,.95);border-radius:16px;padding:6px;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.cell{border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;background:#f0f0f0;user-select:none}
.cell.sel{outline:3px solid #ffcc00;transform:scale(.95)}
.btn{background:#ffcc00;color:#333;border:0;padding:12px 22px;border-radius:25px;font-weight:800;font-size:16px;margin:6px;cursor:pointer}
.btn2{background:#fff}
#msg{font-weight:700;min-height:22px}
#leader{background:rgba(255,255,255,.15);margin:12px;border-radius:12px;padding:10px;text-align:left}
#leader b{display:block;margin-bottom:6px;text-align:center}
.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.2);font-size:14px}
</style>
</head>
<body>
<div class="top"><span id="coins">🪙 100</span><span id="level">⭐ Level 1</span><span id="score">Score: 0</span></div>
<h1>🍬 Candy Match</h1>
<div class="sub">Tap 2 candies to swap • Match 3+ to win coins</div>
<div id="msg">Match 3 candies to score!</div>
<div id="board"></div>
<button class="btn" onclick="newGame()">🔄 New Game</button>
<button class="btn btn2" onclick="invite()">👥 Invite +50 🪙</button>
<div id="leader"><b>🏆 Top Players</b><div id="list">Loading...</div></div>

<script>
let tg = window.Telegram?.WebApp; if(tg) tg.expand();
let userId = tg?.initDataUnsafe?.user?.id?.toString() || "guest_"+Math.floor(Math.random()*99999);
let username = tg?.initDataUnsafe?.user?.first_name || "Player";
let coins=100, score=0, level=1, selected=null;
const candies=['🍬','🍭','🍫','🍩','🍪','🍒','🍓','🍇'];
let board=[];
const el=document.getElementById('board');

function save(){fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,coins,score,level})});}
function updateUI(){document.getElementById('coins').innerText='🪙 '+coins;document.getElementById('score').innerText='Score: '+score;document.getElementById('level').innerText='⭐ Level '+level;}
function build(){board=[];el.innerHTML='';for(let i=0;i<64;i++){let c=candies[Math.floor(Math.random()*candies.length)];board.push(c);let d=document.createElement('div');d.className='cell';d.innerText=c;d.onclick=()=>clickCell(i,d);el.appendChild(d);}}
function render(){[...el.children].forEach((d,i)=>{d.innerText=board[i];d.classList.toggle('sel',i===selected);});}
function clickCell(i,d){if(selected===null){selected=i;render();return;}let a=selected;selected=null;let r1=Math.floor(a/8),c1=a%8,r2=Math.floor(i/8),c2=i%8;if(Math.abs(r1-r2)+Math.abs(c1-c2)!==1){render();return;}[board[a],board[i]]=[board[i],board[a]];render();setTimeout(checkMatches,200);}
function checkMatches(){let matched=new Set();for(let r=0;r<8;r++)for(let c=0;c<6;c++){let idx=r*8+c;if(board[idx]===board[idx+1]&&board[idx]===board[idx+2]){matched.add(idx);matched.add(idx+1);matched.add(idx+2);}}for(let c=0;c<8;c++)for(let r=0;r<6;r++){let idx=r*8+c;if(board[idx]===board[idx+8]&&board[idx]===board[idx+16]){matched.add(idx);matched.add(idx+8);matched.add(idx+16);}}if(matched.size===0)return;let gained=matched.size*10;score+=gained;coins+=Math.floor(gained/2);document.getElementById('msg').innerText=`🎉 +${gained} points! +${Math.floor(gained/2)} coins!`;if(score>0&&score%200===0){level++;document.getElementById('msg').innerText=`🎉 LEVEL UP! You are now Level ${level}!`;}matched.forEach(i=>board[i]=candies[Math.floor(Math.random()*candies.length)]);updateUI();save();setTimeout(checkMatches,300);render();}
function newGame(){score=0;selected=null;document.getElementById('msg').innerText='New game! Good luck!';build();updateUI();}
function invite(){let link=`https://t.me/${tg?.initDataUnsafe?.user?.username||'yourbot'}?start=${userId}`;if(tg)tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent('Play Candy Match with me! +100 coins free!')}`);else alert('Your invite link: '+link);}
async function load(){try{let r=await fetch('/api/user',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,username,referred_by:tg?.initDataUnsafe?.start_param||null})});let d=await r.json();coins=d.coins;score=0;level=d.level;updateUI();let l=await (await fetch('/api/leaderboard')).json();document.getElementById('list').innerHTML=l.map((x,i)=>`<div class="row"><span>${i+1}. ${x.name}</span><span>${x.score} pts • ${x.coins} 🪙</span></div>`).join('')||'No players yet';}catch(e){document.getElementById('list').innerText='Play to appear here!';}}
build();updateUI();load();
</script>
</body>
</html>
