<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Cyber Match • Play & Earn Crypto</title>
<style>
  :root {
    --bg-dark: #090b10;
    --bg-panel: #111622;
    --bg-card: rgba(20, 27, 42, 0.85);
    --neon-cyan: #00f5d4;
    --neon-pink: #ff2a85;
    --neon-purple: #7b2cbf;
    --neon-amber: #ffb703;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border-glow: rgba(0, 245, 212, 0.25);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at top, #161d30 0%, var(--bg-dark) 75%);
    color: var(--text-main);
    padding-bottom: 32px;
    min-height: 100vh;
  }

  /* Header & Profile */
  .header {
    background: linear-gradient(180deg, #131a2c 0%, #0d111c 100%);
    padding: 16px 14px 16px;
    border-radius: 0 0 26px 26px;
    border-bottom: 1px solid var(--border-glow);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
  }

  .profile { display: flex; align-items: center; gap: 12px; }

  .avatar {
    width: 52px; height: 52px; border-radius: 16px;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 900; color: #090b10;
    border: 2px solid var(--neon-cyan);
    box-shadow: 0 0 15px rgba(0, 245, 212, 0.4);
    overflow: hidden;
  }

  .p-name { font-weight: 900; font-size: 18px; letter-spacing: 0.3px; }
  .p-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .badge {
    background: rgba(0, 245, 212, 0.15);
    color: var(--neon-cyan);
    border: 1px solid var(--neon-cyan);
    font-size: 10px; font-weight: 800;
    padding: 3px 9px; border-radius: 20px;
    margin-top: 5px; display: inline-block;
    letter-spacing: 0.6px;
  }

  /* Stats Bar */
  .coin-bar { display: flex; gap: 8px; margin-top: 14px; }

  .coin-box {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px; padding: 10px 6px; text-align: center;
  }

  .coin-box b { font-size: 18px; display: block; color: var(--text-main); }
  .coin-box span { font-size: 10px; letter-spacing: 0.8px; color: var(--text-muted); font-weight: 700; }

  .coin-box.gold {
    background: linear-gradient(135deg, rgba(0, 245, 212, 0.18), rgba(123, 44, 191, 0.25));
    border: 1px solid var(--neon-cyan);
    box-shadow: 0 0 18px rgba(0, 245, 212, 0.2);
  }
  .coin-box.gold b { color: var(--neon-cyan); }

  /* Game Title & Progress */
  .title {
    text-align: center; margin: 16px 0 2px;
    font-size: 26px; font-weight: 900; letter-spacing: 0.5px;
    background: linear-gradient(90deg, #fff, var(--neon-cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .subtitle { text-align: center; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }

  .progress {
    height: 8px; background: rgba(255, 255, 255, 0.08);
    border-radius: 20px; margin: 10px 18px; overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .progress i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
    width: 0%; border-radius: 20px; transition: width 0.3s ease;
    box-shadow: 0 0 10px var(--neon-cyan);
  }

  #msg {
    text-align: center; font-weight: 800; min-height: 22px;
    color: var(--neon-amber); font-size: 13.5px; letter-spacing: 0.3px;
  }

  /* Game Board */
  #board {
    width: 344px; max-width: 94vw; margin: 10px auto;
    background: #101522;
    border: 1.5px solid rgba(0, 245, 212, 0.3);
    border-radius: 22px; padding: 8px;
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75), inset 0 0 20px rgba(0, 245, 212, 0.05);
  }

  .cell {
    border-radius: 11px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; cursor: pointer;
    background: #192136;
    border: 1px solid rgba(255, 255, 255, 0.04);
    user-select: none; aspect-ratio: 1; transition: transform 0.12s, background 0.15s;
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.35);
  }

  .cell:active { transform: scale(0.9); }

  .cell.sel {
    outline: 2px solid var(--neon-cyan);
    transform: scale(0.88);
    background: rgba(0, 245, 212, 0.2);
    box-shadow: 0 0 14px rgba(0, 245, 212, 0.6);
  }

  /* Action Buttons */
  .btns { display: flex; gap: 10px; padding: 0 14px; margin-top: 8px; }

  .btn {
    flex: 1;
    background: linear-gradient(135deg, var(--neon-cyan), #00bbf9);
    color: #06090f; border: 0; padding: 13px; border-radius: 16px;
    font-weight: 900; font-size: 13.5px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 245, 212, 0.28);
    transition: transform 0.1s;
  }

  .btn:active { transform: scale(0.96); }

  .btn2 {
    background: #1a2236; color: var(--text-main);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
  }

  .btn-pink {
    background: linear-gradient(135deg, var(--neon-pink), #b5179e);
    color: #fff;
    box-shadow: 0 6px 18px rgba(255, 42, 133, 0.32);
  }

  /* Leaderboard */
  #leader {
    background: var(--bg-panel);
    border: 1px solid rgba(255, 255, 255, 0.08);
    margin: 16px 14px 0; border-radius: 20px; padding: 14px;
  }

  #leader-title {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; font-weight: 900; font-size: 15px;
    color: var(--neon-cyan);
  }

  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    font-size: 13.5px;
  }
  .row:last-child { border-bottom: none; }

  .player-info { display: flex; align-items: center; gap: 8px; }
  .rank-badge {
    width: 22px; height: 22px; border-radius: 6px;
    background: rgba(255, 255, 255, 0.08);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 900;
  }
  .rank-1 { background: #ffb703; color: #000; }
  .rank-2 { background: #cbd5e1; color: #000; }
  .rank-3 { background: #d97706; color: #fff; }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block;
  }
  .online { background: #00f5d4; box-shadow: 0 0 8px #00f5d4; }
  .offline { background: #64748b; }

  .player-score { font-weight: 800; color: var(--neon-amber); }

  /* Modals */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(5, 7, 12, 0.85); backdrop-filter: blur(6px);
    z-index: 999; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-overlay.open { display: flex; }

  .modal-card {
    background: #131929; border: 1px solid var(--neon-cyan);
    border-radius: 22px; width: 100%; max-width: 380px; padding: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
  }

  .modal-card h3 { margin: 0 0 6px; font-size: 20px; color: var(--neon-cyan); }
  .modal-card p { margin: 0 0 14px; font-size: 13px; color: var(--text-muted); line-height: 1.45; }

  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: #cbd5e1; }

  .form-control {
    width: 100%; padding: 11px 12px; border-radius: 12px;
    background: #0b0f19; border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff; font-size: 14px; outline: none;
  }
  .form-control:focus { border-color: var(--neon-cyan); }

  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
</style>
</head>
<body>

<div class="header">
  <div class="profile">
    <div class="avatar" id="avatar">⚡</div>
    <div>
      <div class="p-name" id="pname">Player</div>
      <div class="p-sub">Cyber Arena • Play & Earn</div>
      <span class="badge">⚡ PRO GAMER</span>
    </div>
  </div>
  <div class="coin-bar">
    <div class="coin-box gold"><b id="coins">🪙 100</b><span>COINS</span></div>
    <div class="coin-box"><b id="level">⭐ 1</b><span>LEVEL</span></div>
    <div class="coin-box"><b id="score">0</b><span>SCORE</span></div>
  </div>
</div>

<div class="title">⚡ CYBER MATCH</div>
<div class="subtitle">Swap adjacent gems • Match 3+ to mine coins</div>
<div class="progress"><i id="prog"></i></div>
<div id="msg">Match 3 gems to score!</div>

<div id="board"></div>

<div class="btns">
  <button class="btn" onclick="newGame()">🔄 New Board</button>
  <button class="btn btn2" onclick="invite()">👥 Refer +50 🪙</button>
</div>
<div class="btns">
  <button class="btn btn-pink" onclick="openWithdrawModal()">💸 Withdraw Crypto</button>
  <button class="btn btn2" onclick="openRulesModal()">📜 How to Earn</button>
</div>

<div id="leader">
  <div id="leader-title">
    <span>🏆 Top Arena Players</span>
    <span style="font-size:11px;color:var(--text-muted)">Unique Ranking</span>
  </div>
  <div id="list">Loading players...</div>
</div>

<!-- Withdraw Modal -->
<div class="modal-overlay" id="withdrawModal">
  <div class="modal-card">
    <h3>💸 Crypto Cashout</h3>
    <p>Available Balance: <b id="modalCoins" style="color:var(--neon-cyan)">100</b> 🪙 (Min: 1,000 🪙)</p>

    <div class="form-group">
      <label>Payout Method</label>
      <select class="form-control" id="payoutMethod" onchange="updateWalletPlaceholder()">
        <option value="FaucetPay">⚡ FaucetPay (Instant Micro-Wallet)</option>
        <option value="USDT_TRC20">💵 USDT (TRC20 Network)</option>
        <option value="USDT_BEP20">💵 USDT (BEP20 / BSC)</option>
        <option value="TRX">🔴 TRON (TRX)</option>
        <option value="LTC">⚪ Litecoin (LTC)</option>
        <option value="DOGE">🟡 Dogecoin (DOGE)</option>
