<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Candy Match Premium</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui;background:#12051f;color:#fff;padding-bottom:24px}
.header{background:linear-gradient(180deg,#3b1168,#1e0a3a);padding:16px 14px 14px;border-radius:0 0 24px 24px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.profile{display:flex;align-items:center;gap:11px}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#ff5e8a,#ffcc00);display:flex;align-items:center;justify-content:center;font-size:26px;border:2px solid #fff;box-shadow:0 0 0 3px rgba(255,204,0,.4);overflow:hidden}
.p-name{font-weight:900;font-size:18px;line-height:1.1}
.p-sub{font-size:12px;opacity:.75}
.badge{background:#ffcc00;color:#333;font-size:10px;font-weight:900;padding:3px 8px;border-radius:20px;margin-top:4px;display:inline-block}
.coin-bar{display:flex;gap:8px;margin-top:14px}
.coin-box{flex:1;background:rgba(255,255,255,.10);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:11px 6px;text-align:center}
.coin-box b{font-size:19px;display:block}
.coin-box span{font-size:10px;letter-spacing:.5px;opacity:.8}
.coin-box.gold{background:linear-gradient(135deg,#ffe066,#ff9d00);color:#2a1000;border:0;box-shadow:0 6px 18px rgba(255,170,0,.45)}
.title{text-align:center;margin:16px 0 2px;font-size:27px;font-weight:900;letter-spacing:.3px}
.subtitle{text-align:center;font-size:12.5px;opacity:.7;margin-bottom:6px}
.progress{height:8px;background:rgba(255,255,255,.15);border-radius:20px;margin:10px 18px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#ffcc00,#ff5e8a);width:20%;border-radius:20px}
#msg{text-align:center;font-weight:800;min-height:22px;color:#ffe066;font-size:14px}
#board{width:344px;max-width:94vw;margin:10px auto;background:linear-gradient(180deg,#ffffff,#f7f0ff);border-radius:22px;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:5px;box-shadow:0 14px 35px rgba(0,0,0,.5)}
.cell{border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;background:#f1e8ff;user-select:none;aspect-ratio:1;transition:.15s;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)}
.cell:active{transform:scale(.9)}
.cell.sel{outline:3px solid #ffcc00;transform:scale(.88);background:#fff3c4;box-shadow:0 0 0 3px #ffcc00,0 6px 14px rgba(255,204,0,.5)}
.btns{display:flex;gap:10px;padding:0 14px;margin-top:4px}
.btn{flex:1;background:linear-gradient(135deg,#ffcc00,#ff9d00);color:#2a1000;border:0;padding:14px;border-radius:26px;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 6px 16px rgba(255,170,0,.35)}
.btn:active{transform:scale(.96)}
.btn2{background:#fff;color:#333;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.btn-green{background:linear-gradient(135deg,#00e676,#00b248);color:#fff;box-shadow:0 6px 16px rgba(0,230,118,.35)}
#leader{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);margin:14px;border-radius:18px;padding:12px}
#leader b{display:block;margin-bottom:6px;text-align:center}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:14px}
</style>
</head>
<body>
<div class="header">
  <div class="profile">
    <div class="avatar" id="avatar">😊</div>
    <div>
      <div class="p-name" id="pname">Player</div>
      <div class="p-sub">Candy Master • Play & Earn</div>
      <span class="badge">✨ PREMIUM PLAYER</span>
    </div>
  </div>
  <div class="coin-bar">
    <div class="coin-box gold"><b id="coins">🪙 100</b><span>COINS</span></div>
    <div class="coin-box"><b id="level">⭐ 1</b><span>LEVEL</span></div>
    <div class="coin-box"><b id="score">0</b><span>SCORE</span></div>
  </div>
</div>
<div class="title">🍬 Candy Match</div>
<div class="subtitle">Tap 2 candies to swap • Match 3+ to win coins</div>
<div class="progress"><i id="prog"></i></div>
<div id="msg">Match 3 candies to score!</div>
<div id="board"></div>
<div class="btns">
  <button class="btn" onclick="newGame()">🔄 New Game</button>
  <button class="btn btn2" onclick="invite()">👥 Refer +50 🪙</button>
</div>
<div class="btns" style="margin-top:10px">
  <button class="btn btn-green" onclick="withdraw()">💰 Withdraw</button>
  <button class="btn btn2" onclick="showRules()">📜 How to Earn</button>
</div>
<div id="leader"><b>🏆 Top Players</b><div id="list">Loading...</div></div>
<script>
let tg=window.Telegram?.WebApp; if(tg){tg.expand();tg.setHeaderColor('#3b1168');}
let userId=tg?.initDataUnsafe?.user?.id?.toString()||"guest_"+Math.floor(Math.random()*99999);
let username=tg?.initDataUnsafe?.user?.first_name||"Player";
let photo=tg?.initDataUnsafe?.user?.photo_url;
if(photo){document.getElementById('avatar').innerHTML=`<img src="${photo}" style="width:100%;height:100%;object-fit:cover">`;}else{document.getElementById('avatar').innerText=username[0].toUpperCase();}
document.getElementById('pname').innerText=username;
let coins=100,score=0,level=1,selected=null;
const candies=['🍬','🍭','🍫','🍩','🍪','🍒','🍓','🍇'];
let board=[];const el=document.getElementById('board');
function save(){fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,coins,score,level})});}
function updateUI(){document.getElementById('coins').innerText='🪙 '+coins;document.getElementById('score').innerText=score;document.getElementById('level').innerText='⭐ '+level;document.getElementById('prog').style.width=Math.min(100,(score%200)/2)+'%';}
function build(){board=[];el.innerHTML='';for(let i=0;i<64;i++){let c=candies[Math.floor(Math.random()*candies.length)];board.push(c);let d=document.createElement('div');d.className='cell';d.innerText=c;d.onclick=()=>clickCell(i);el.appendChild(d);}}
function render(){[...el.children].forEach((d,i)=>{d.innerText=board[i];d.classList.toggle('sel',i===selected);});}
function clickCell(i){if(selected===null){selected=i;render();return;}let a=selected;selected=null;let r1=Math.floor(a/8),c1=a%8,r2=Math.floor(i/8),c2=i%8;if(Math.abs(r1-r2)+Math.abs(c1-c2)!==1){render();return;}[board[a],board[i]]=[board[i],board[a]];render();setTimeout(checkMatches,200);}
function checkMatches(){let matched=new Set();for(let r=0;r<8;r++)for(let c=0;c<6;c++){let idx=r*8+c;if(board[idx]===board[idx+1]&&board[idx]===board[idx+2]){matched.add(idx);matched.add(idx+1);matched.add(idx+2);}}for(let c=0;c<8;c++)for(let r=0;r<6;r++){let idx=r*8+c;if(board[idx]===board[idx+8]&&board[idx]===board[idx+16]){matched.add(idx);matched.add(idx+8);matched.add(idx+16);}}if(matched.size===0)return;let gained=matched.size*10;score+=gained;coins+=Math.floor(gained/2);document.getElementById('msg').innerText=`🎉 +${gained} pts! +${Math.floor(gained/2)} coins!`;if(score>0&&score%200===0){level++;document.getElementById('msg').innerText=`🎉 LEVEL UP! Level ${level}!`;}matched.forEach(i=>board[i]=candies[Math.floor(Math.random()*candies.length)]);updateUI();save();setTimeout(checkMatches,300);render();}
function newGame(){score=0;selected=null;document.getElementById('msg').innerText='New game! Good luck!';build();updateUI();}
function invite(){let link=`https://t.me/candymatchs_bot?start=${userId}`;if(tg)tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent('Play Candy Match with me! +100 coins free!')}`);else alert('Your invite link: '+link);}
function withdraw(){if(coins<1000){alert('You need at least 1,000 coins to withdraw.\n\nYou have: '+coins+' 🪙\nKeep playing and inviting friends!');return;}let wallet=prompt('Enter your account / wallet:\n\nYou have '+coins+' coins\nMinimum: 1,000 coins');if(!wallet)return;alert('✅ Withdraw request sent!\nAmount: '+coins+' coins\nWallet: '+wallet+'\nAdmin will review within 24h.');fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,coins,score,level,withdraw_request:wallet})});}
function showRules(){alert('📜 HOW TO EARN:\n\n🍬 Match 3 candies = +15 coins\n👥 Invite a friend = +50 coins\n⭐ Level Up = Bonus coins\n💰 Withdraw at 1,000+ coins');}
async function load(){try{let r=await fetch('/api/user',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,username,referred_by:tg?.initDataUnsafe?.start_param||null})});let d=await r.json();coins=d.coins;level=d.level;updateUI();let l=await (await fetch('/api/leaderboard')).json();document.getElementById('list').innerHTML=l.map((x,i)=>`<div class="row"><span>${i+1}. ${x.name}</span><span>${x.score} pts • ${x.coins} 🪙</span></div>`).join('')||'No players yet';}catch(e){document.getElementById('list').innerText='Play to appear here!';}}
build();updateUI();load();
</script>
</body>
</html>
