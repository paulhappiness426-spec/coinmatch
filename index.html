<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoinMatch - Match 3</title>
<style>
body{font-family:Arial;text-align:center;background:#1a1a2e;color:white;margin:0;padding:10px}
h1{color:#ffd700;margin:5px}
.box{background:#16213e;border-radius:15px;padding:10px;margin:10px auto;max-width:360px}
#board{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-width:360px;margin:10px auto}
.cell{font-size:28px;background:#0f3460;border-radius:10px;padding:10px 0;cursor:pointer}
.cell.sel{outline:3px solid yellow;background:#e94560}
button{background:#ffd700;border:none;padding:10px 15px;border-radius:10px;font-weight:bold;margin:5px;cursor:pointer}
</style>
</head>
<body>
<h1>🪙 CoinMatch</h1>
<div class="box">
🪙 <span id="coins">0</span> Coins | Level <span id="level">1</span><br><br>
Score: <span id="score">0</span> / 100<br>
Moves: <span id="moves">15</span>
</div>
<div id="board"></div>
<div class="box">
<p>Tap 2 fruits to swap. Match 3 same = +10 Score.</p>
<button onclick="addMoves()">📺 Watch Ad - Get +10 Moves</button><br>
<button onclick="location.reload()">🔄 Restart</button>
</div>
<script>
let fruits=['🍎','🍌','🍇','🍊','🍓','🥝'];
let board=[], score=0, moves=15, coins=0, level=1, sel=null;
function make(){
  board=[];
  for(let i=0;i<36;i++) board.push(fruits[Math.floor(Math.random()*fruits.length)]);
  draw();
}
function draw(){
  let b=document.getElementById('board'); b.innerHTML='';
  board.forEach((f,i)=>{
    let d=document.createElement('div');
    d.className='cell'+(sel===i?' sel':'');
    d.textContent=f;
    d.onclick=()=>tap(i);
    b.appendChild(d);
  });
  document.getElementById('score').textContent=score;
  document.getElementById('moves').textContent=moves;
  document.getElementById('coins').textContent=coins;
  document.getElementById('level').textContent=level;
}
function tap(i){
  if(sel===null){sel=i; draw(); return;}
  let a=sel; sel=null;
  let tmp=board[a]; board[a]=board[i]; board[i]=tmp;
  moves--; check();
  draw();
  if(moves<=0) alert('Game Over! Score: '+score);
  if(score>=100){ coins+=50; level++; score=0; moves=15; alert('Level Complete! +50 Coins!'); draw(); }
}
function check(){
  for(let r=0;r<6;r++) for(let c=0;c<4;c++){
    let i=r*6+c;
    if(board[i]===board[i+1] && board[i]===board[i+2]){
      score+=10;
      board[i]=fruits[Math.floor(Math.random()*fruits.length)];
      board[i+1]=fruits[Math.floor(Math.random()*fruits.length)];
      board[i+2]=fruits[Math.floor(Math.random()*fruits.length)];
    }
  }
}
function addMoves(){ moves+=10; draw(); alert('+10 Moves Added!'); }
make();
</script>
</body>
</html>
